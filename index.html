<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de ruta</title>
<meta name="theme-color" content="#1F43A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuaderno de ruta">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#EEF1F5;color:#141B29;text-align:center;padding:24px}
  img{width:120px;height:120px;border-radius:28px}
  h1{margin:0;font-size:1.4rem}
  p{margin:0;max-width:320px;line-height:1.5;color:#566074}
  a.btn{background:#1F43A6;color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:12px}
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <h1>Cuaderno de ruta</h1>
  <p id="msg">Para instalarla: en Android, menú ⋮ de Chrome → «Instalar aplicación». En iPhone, en Safari, botón Compartir → «Añadir a pantalla de inicio».</p>
  <a class="btn" id="go" href="#">Abrir el cuaderno</a>
<script>
  var URL_APP = 'https://script.google.com/macros/s/AKfycbzx7YjTmzpTSd8TSMsctnQzE7KMzVGx4ZSImmz1t8_p-Iw0d6zmDZqTr5OpQdBf70RG/exec';

  document.getElementById('go').href = URL_APP;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  var instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (instalada) {
    document.getElementById('msg').textContent = 'Abriendo…';
    location.replace(URL_APP);
  }
</script>
</body>
</html>
